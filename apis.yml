name: Jellyfish
description: 'Jellyfish is a software engineering intelligence (SEI) platform that turns
  data from developer tools — issue trackers (Jira, Linear, Azure Boards), source
  control and CI/CD (GitHub, Azure DevOps), and AI coding assistants (Claude Code,
  Cursor, GitHub Copilot, Amazon Q, Gemini Code Assist) — into productivity and
  business-impact insights for R&D leaders. The platform measures AI adoption,
  engineering allocation, and delivery across the software development lifecycle
  through a Data Hub, extensible dashboards, and AI-assisted custom queries.
  Jellyfish is an enterprise, demo-gated product with no public self-service API;
  data access is delivered through the product and its integrations rather than a
  documented developer API. Backed by Accel, Insight Partners, and Wing Venture
  Capital.'
